name: User Story
description: Item do Product Backlog no formato "Eu como... preciso... de modo que..." com critérios em Gherkin
title: "[Épico] Título da história"
labels: ["user-story"]
body:
  - type: markdown
    attributes:
      value: |
        Preencha o que for possível. O **PO** completa a priorização e a **equipe** estima no Planning Poker.
        Prioridade, Story Points, Sprint e Release são definidos nos **campos do GitHub Projects**, não aqui.
  - type: textarea
    id: historia
    attributes:
      label: História
      description: Quem precisa, o que precisa e por quê.
      placeholder: "Eu como **<perfil>**, preciso **<ação>**, de modo que **<benefício>**."
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      description: Cenários em Gherkin, com ao menos um de sucesso e um de exceção. Cada cenário é verificável pelo QA.
      placeholder: |
        **Cenário 1 (sucesso): título**
        - **Dado que** [contexto]
        - **Quando** [ação]
        - **Então** [resultado esperado]

        **Cenário 2 (exceção): título**
        - **Dado que** [contexto]
        - **Quando** [ação]
        - **Então** [resultado esperado]
    validations:
      required: true
  - type: input
    id: regras
    attributes:
      label: Regras de negócio relacionadas
      description: Identificadores de docs/produto/regras-de-negocio.md.
      placeholder: "RN-04, RN-05"
  - type: textarea
    id: notas
    attributes:
      label: Notas e dependências
      description: Itens que precisam estar prontos antes, riscos, observações técnicas.
  - type: checkboxes
    id: dor
    attributes:
      label: Definition of Ready
      description: A história só entra em "Pronto para a sprint" com tudo marcado (ver docs/produto/definition-of-done.md).
      options:
        - label: Está no formato Eu como... preciso... de modo que..., com perfil identificado
        - label: Os critérios estão em Gherkin (Dado que / Quando / Então), com cenário de sucesso e de exceção
        - label: Foi estimada e vale no máximo 5 pontos
        - label: Não depende de item que ficou fora da sprint
