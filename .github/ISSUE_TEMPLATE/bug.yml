name: Bug
description: Defeito encontrado durante o desenvolvimento ou a validação
title: "[Bug] Resumo do problema"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Bug bem registrado é bug reproduzível. Preencha **passos**, **evidência** e **severidade**.
        O QA acompanha o status até a correção ser validada.
  - type: input
    id: historia
    attributes:
      label: História ou item relacionado
      description: Número da issue em que o defeito apareceu.
      placeholder: "#12"
    validations:
      required: true
  - type: dropdown
    id: severidade
    attributes:
      label: Severidade
      description: Critérios em docs/qualidade/plano-de-qualidade.md.
      options:
        - Crítica — bloqueia o fluxo principal, perde dado ou viola uma regra de negócio central
        - Alta — funcionalidade importante não funciona, com contorno difícil
        - Média — funcionalidade com defeito, com contorno possível
        - Baixa — cosmético ou de baixo impacto
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Entre como cliente
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
      description: O que deveria acontecer segundo os critérios de aceite.
    validations:
      required: true
  - type: textarea
    id: obtido
    attributes:
      label: Resultado obtido
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidências
      description: Prints, trechos de log ou saída de teste. Arraste a imagem para este campo.
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      description: Navegador, sistema operacional, local ou homologação.
      placeholder: "Local, Chrome 130, Windows 11"
  - type: input
    id: versao
    attributes:
      label: Commit ou versão
      placeholder: "a1b2c3d ou v0.1.0"
